[project]
name = "zimyo-attendance"
version = "0.1.0"
description = "Zimyo Attendance Logger - Automated clock in/out using LangGraph agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "pytz>=2024.1",
    "rich>=13.7.0",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.62.0",
    "selenium>=4.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
